<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add a book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <header class="site-header">
    <p class="site-title"><a href="{{ url_for('index') }}">My Library</a></p>
    <nav class="site-nav">
      <a href="{{ url_for('index') }}">Library</a>
      <a href="{{ url_for('add_book') }}" aria-current="page">Add a book</a>
      <a href="{{ url_for('add_author') }}">Add an author</a>
    </nav>
  </header>

  <main>
    <h1 class="page-title">Add a book</h1>
    {% if message %}
    <p class="message">{{ message }}</p>
    {% endif %}

    <form class="form" action="{{ url_for('add_book') }}" method="post">
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required>
      </div>

      <div class="field">
        <label for="author_id">Author</label>
        <select id="author_id" name="author_id" required>
          {% for author in authors %}
          <option value="{{ author.id }}">{{ author.name }}</option>
          {% else %}
          <option value="" disabled>No authors yet, add one first</option>
          {% endfor %}
        </select>
        <span class="hint">Not in the list? <a href="{{ url_for('add_author') }}">Add the author first</a></span>
      </div>

      <div class="field">
        <label for="isbn">ISBN</label>
        <input type="text" id="isbn" name="isbn" required>
      </div>

      <div class="field">
        <label for="publishing_year">Year published</label>
        <input type="number" id="publishing_year" name="publishing_year" min="0" max="2100" required>
      </div>

      <button type="submit" class="button">Add book</button>
    </form>
  </main>
</body>

</html>
