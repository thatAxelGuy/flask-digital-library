<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add an author</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <header class="site-header">
    <p class="site-title"><a href="{{ url_for('index') }}">My Library</a></p>
    <nav class="site-nav">
      <a href="{{ url_for('index') }}">Library</a>
      <a href="{{ url_for('add_book') }}">Add a book</a>
      <a href="{{ url_for('add_author') }}" aria-current="page">Add an author</a>
    </nav>
  </header>

  <main>
    <h1 class="page-title">Add an author</h1>
    {% if message %}
    <p class="message">{{ message }}</p>
    {% endif %}

    <form class="form" action="{{ url_for('add_author') }}" method="post">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="field">
        <label for="birthdate">Born</label>
        <input type="date" id="birthdate" name="birthdate">
        <span class="hint">Leave empty if unknown</span>
      </div>

      <div class="field">
        <label for="date_of_death">Died</label>
        <input type="date" id="date_of_death" name="date_of_death">
        <span class="hint">Leave empty if the author is alive or the date is unknown</span>
      </div>

      <button type="submit" class="button">Add author</button>
    </form>
  </main>
</body>

</html>
