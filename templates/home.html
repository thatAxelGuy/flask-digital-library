<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
  </head>
  <body>

  {% for book in books %}
    <div>
      <h3>{{ book.title }}</h3>
      <p>by {{ book.author.name }} ({{ book.publishing_year }})</p>
    </div>
  {% else %}
    <p>No books yet. <a href="/add_book">Add one</a>.</p>
  {% endfor %}

  </body>
</html>
